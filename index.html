<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Идеальный фильм - поиск по году и жанру</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🎬 Найди идеальный фильм</h1>
        
        <div class="filters">
            <div class="filter-group">
                <label>Год выпуска:</label>
                <select id="year"></select>
            </div>
            
            <div class="filter-group">
                <label>Жанр:</label>
                <select id="genre">
                    <option value="">Любой</option>
                    <option value="1">Комедия</option>
                    <option value="2">Драма</option>
                    <option value="3">Боевик</option>
                    <option value="4">Триллер</option>
                    <option value="5">Фантастика</option>
                    <option value="6">Ужасы</option>
                    <option value="7">Мелодрама</option>
                    <option value="8">Детектив</option>
                </select>
            </div>
            
            <div class="filter-group">
                <label>Исключить темы в описании:</label>
                <input type="text" id="excludeKeywords" placeholder="война, депрессия, насилие">
                <small>Через запятую</small>
            </div>
            
            <button id="searchBtn">🔍 Искать фильм</button>
        </div>
        
        <div id="results" class="results"></div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
