<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>MovieFinder | Идеальный фильм за минуту</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

<div class="bg-gradient"></div>

<div class="container">
    <header>
        <h1><i class="fas fa-film"></i> MovieFinder</h1>
        <p>Найди фильм, который понравится именно тебе — без скучных тем</p>
        <p style="font-size: 0.8rem; opacity: 0.7;">🎬 Данные от TMDB</p>
    </header>

    <div class="search-card">
        <div class="filters-row">
            <div class="filter-group">
                <label><i class="fas fa-calendar-alt"></i> Год выпуска</label>
                <input type="number" id="yearInput" placeholder="2023" value="2023" min="1890" max="2030">
            </div>

            <div class="filter-group">
                <label><i class="fas fa-tags"></i> Жанр</label>
                <select id="genreSelect">
                    <option value="">Любой жанр</option>
                    <option value="28">Боевик</option>
                    <option value="12">Приключения</option>
                    <option value="16">Анимация</option>
                    <option value="35">Комедия</option>
                    <option value="80">Криминал</option>
                    <option value="99">Документальный</option>
                    <option value="18">Драма</option>
                    <option value="10751">Семейный</option>
                    <option value="14">Фэнтези</option>
                    <option value="36">История</option>
                    <option value="27">Ужасы</option>
                    <option value="10402">Музыка</option>
                    <option value="9648">Детектив</option>
                    <option value="10749">Мелодрама</option>
                    <option value="878">Фантастика</option>
                    <option value="10770">ТВ фильм</option>
                    <option value="53">Триллер</option>
                    <option value="10752">Военный</option>
                    <option value="37">Вестерн</option>
                </select>
            </div>

            <div class="filter-group exclude-group">
                <label><i class="fas fa-ban"></i> Исключить темы</label>
                <div class="exclude-tags">
                    <span class="exclude-tag" data-tag="насилие">🚫 насилие</span>
                    <span class="exclude-tag" data-tag="кровь">🩸 кровь</span>
                    <span class="exclude-tag" data-tag="жестокость">⚔️ жестокость</span>
                    <span class="exclude-tag" data-tag="депрессия">😔 депрессия</span>
                    <span class="exclude-tag" data-tag="ужасы">👻 хоррор-сцены</span>
                    <span class="exclude-tag" data-tag="политика">🏛️ политика</span>
                    <span class="exclude-tag" data-tag="война">⚔️ война</span>
                </div>
                <div class="exclude-input-wrapper">
                    <input type="text" id="customExclude" placeholder="или своя тема...">
                    <button id="addExcludeBtn" class="small-btn">+</button>
                </div>
                <div class="active-excludes" id="activeExcludes"></div>
            </div>
        </div>

        <button id="searchBtn" class="search-btn"><i class="fas fa-search"></i> Найти идеальный фильм</button>
    </div>

    <div id="loadingIndicator" class="loading hidden">
        <div class="spinner"></div>
        <p>Ищем в базе TMDB...</p>
    </div>

    <div id="resultsContainer" class="results-grid"></div>
    <div id="errorMessage" class="error-message hidden"></div>
</div>

<script src="app.js"></script>
</body>
</html>
